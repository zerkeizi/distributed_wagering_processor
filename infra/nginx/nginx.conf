# Balanceia entre as réplicas do serviço `app`. O resolver do Docker é consultado a cada 10s,
# então réplicas que sobem ou caem entram e saem do pool sem reiniciar o nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream wagering_app {
    zone wagering_app 64k;
    server app:3000 resolve;
    keepalive 32;
}

server {
    listen 8080;

    location / {
        proxy_pass http://wagering_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
